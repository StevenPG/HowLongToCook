name: Bug report
description: Something isn't working as expected
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! For security issues, please use
        [private vulnerability reporting](https://github.com/StevenPG/HowLongToCook/security/advisories/new) instead.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Android app
        - Server API
        - Server admin UI
        - Docker / Kubernetes examples
        - Documentation
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Tap …
        3. See error
    validations:
      required: true
  - type: dropdown
    id: storage
    attributes:
      label: Storage backend
      options:
        - This device only
        - Amazon S3
        - Cloudflare R2
        - Other S3-compatible
        - Self-hosted server
        - Not applicable
  - type: input
    id: version
    attributes:
      label: App / server version
      description: Settings → About, or `howlongtocook-server --version`
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: Pixel 8, Android 16
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove tokens, keys and bucket names before pasting.
      render: text
