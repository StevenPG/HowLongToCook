# Publishes a release when a version tag (vMAJOR.MINOR.PATCH) is pushed:
#   1. checks the tag matches server/Cargo.toml and has a CHANGELOG.md section
#   2. runs the server and Android test suites
#   3. builds and pushes the server image to GHCR (with SBOM + provenance attestation)
#   4. builds the signed release APK (with provenance attestation)
#   5. creates the GitHub Release with the APK, its checksum and the changelog notes
# One-time setup (signing secrets, package visibility) is described in RELEASING.md.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      image: ${{ steps.version.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        name: Derive and validate version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          core="${version%%-*}"
          IFS=. read -r major minor patch <<< "$core"
          if (( minor > 99 || patch > 99 )); then
            echo "::error::minor and patch must be <= 99 to derive the Android versionCode"; exit 1
          fi
          # Android versionCode: MMmmpp (0.1.0 -> 100, 1.2.3 -> 10203).
          version_code=$(( major * 10000 + minor * 100 + patch ))

          cargo_version=$(grep -m1 '^version' server/Cargo.toml | cut -d'"' -f2)
          if [[ "$cargo_version" != "$core" ]]; then
            echo "::error::Tag $TAG does not match server/Cargo.toml version $cargo_version"; exit 1
          fi
          if ! grep -q "^## \[$core\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$core]' section"; exit 1
          fi

          {
            echo "version=$version"
            echo "version_code=$version_code"
            echo "prerelease=$([[ "$version" == *-* ]] && echo true || echo false)"
            echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/howlongtocook-server"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $version (versionCode $version_code)"

  test-server:
    name: Server tests
    needs: prepare
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  test-android:
    name: Android tests
    needs: prepare
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Install Android SDK platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" > /dev/null
      - run: ./gradlew --no-configuration-cache testDebugUnitTest lintDebug

  image:
    name: Server image
    needs: [prepare, test-server]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ needs.prepare.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.prerelease == 'false' }}
          labels: |
            org.opencontainers.image.title=howlongtocook-server
            org.opencontainers.image.licenses=GPL-3.0-or-later
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: server
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ needs.prepare.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  apk:
    name: Signed APK
    needs: [prepare, test-android]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Install Android SDK platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::The ANDROID_KEYSTORE_BASE64 secret is not set. See RELEASING.md."; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Build release APK
        env:
          HLTC_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HLTC_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HLTC_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ needs.prepare.outputs.version }}
          VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
        run: |
          export HLTC_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          ./gradlew --no-configuration-cache assembleRelease \
            -PappVersionName="$VERSION" -PappVersionCode="$VERSION_CODE"
      - name: Verify signature and package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          apk="HowLongToCook-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "../$apk"
          apksigner="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          "$apksigner" verify --print-certs "../$apk" | tee ../signing.txt
          if grep -q "CN=Android Debug" ../signing.txt; then
            echo "::error::APK is signed with the debug key"; exit 1
          fi
          (cd .. && sha256sum "$apk" > "$apk.sha256" && cat "$apk.sha256")
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: HowLongToCook-${{ needs.prepare.outputs.version }}.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk
          path: |
            HowLongToCook-${{ needs.prepare.outputs.version }}.apk
            HowLongToCook-${{ needs.prepare.outputs.version }}.apk.sha256
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [prepare, image, apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk
          path: dist
      - name: Write release notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          IMAGE: ${{ needs.prepare.outputs.image }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          core="${VERSION%%-*}"
          {
            echo "## Install"
            echo
            echo "**Android:** download \`HowLongToCook-$VERSION.apk\` below and open it on your phone"
            echo "(allow installs from your browser or file manager when asked). Android 12 or newer."
            echo
            echo "**Server:**"
            echo
            echo '```sh'
            echo "docker pull $IMAGE:$VERSION"
            echo '```'
            echo
            tree="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/tree/$GITHUB_REF_NAME"
            echo "Image digest: \`$DIGEST\`. Setup guides: [Docker]($tree/deploy/docker) · [Kubernetes]($tree/deploy/kubernetes)."
            echo
            echo "## Changes"
            echo
            # The section for this version, without its heading or the link references at the end.
            awk -v v="$core" '/^## \[/ { p = index($0, "## [" v "]") == 1; next } p && !/^\[[^]]+\]: /' CHANGELOG.md
            echo
            echo "## Verify"
            echo
            echo '```sh'
            echo "sha256sum -c HowLongToCook-$VERSION.apk.sha256"
            echo "gh attestation verify HowLongToCook-$VERSION.apk --repo $GITHUB_REPOSITORY"
            echo "gh attestation verify oci://$IMAGE:$VERSION --repo $GITHUB_REPOSITORY"
            echo '```'
          } > notes.md
          cat notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          args=(--verify-tag --title "HowLongToCook $VERSION" --notes-file notes.md)
          [[ "$PRERELEASE" == "true" ]] && args+=(--prerelease)
          gh release create "$TAG" "${args[@]}" dist/*
