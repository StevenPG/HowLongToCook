[package]
name = "howlongtocook-server"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Self-hosted sync backend and admin UI for the HowLongToCook Android app"
publish = false

[[bin]]
name = "howlongtocook-server"
path = "src/main.rs"

[dependencies]
anyhow = "1"
askama = "0.16"
axum = { version = "0.8", features = ["multipart", "macros"] }
axum-extra = { version = "0.12", features = ["cookie"] }
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "io-util", "time", "fs"] }
tower-http = { version = "0.6", features = ["trace", "timeout", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
