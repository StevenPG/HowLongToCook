apiVersion: apps/v1
kind: Deployment
metadata:
  name: howlongtocook
  labels:
    app.kubernetes.io/component: server
spec:
  # SQLite has a single writer: run exactly one replica and never overlap pods.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: howlongtocook
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: howlongtocook
        app.kubernetes.io/component: server
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: howlongtocook-server
          imagePullPolicy: IfNotPresent
          args: ["serve"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HLTC_TOKEN_FILE
              value: /etc/howlongtocook/token
            - name: HLTC_DATABASE_URL
              value: sqlite:///data/howlongtocook.db
            - name: HLTC_SECURE_COOKIES
              value: "true" # served over HTTPS via the ingress
            - name: RUST_LOG
              value: info
          volumeMounts:
            - name: data
              mountPath: /data
            - name: token
              mountPath: /etc/howlongtocook
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: howlongtocook-data
        - name: token
          secret:
            secretName: howlongtocook-token
            items:
              - key: token
                path: token
