# Example only. Prefer creating the secret out-of-band:
#   kubectl -n howlongtocook create secret generic howlongtocook-token \
#     --from-literal=token="$(openssl rand -hex 32)"
apiVersion: v1
kind: Secret
metadata:
  name: howlongtocook-token
type: Opaque
stringData:
  token: change-me-to-a-long-random-value
