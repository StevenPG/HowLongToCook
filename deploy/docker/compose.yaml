# Production-style example: HowLongToCook server with a persistent volume and a
# token supplied via a Docker secret file.
#
#   mkdir -p secrets && openssl rand -hex 32 > secrets/hltc_token
#   docker compose up -d --build
#
# Put a TLS-terminating reverse proxy (Caddy, Traefik, nginx) in front of it for
# access outside your LAN, and set HLTC_SECURE_COOKIES=true when you do.
name: howlongtocook

services:
  server:
    build:
      context: ../../server
    image: howlongtocook-server:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      HLTC_TOKEN_FILE: /run/secrets/hltc_token
      HLTC_SECURE_COOKIES: "false"
      RUST_LOG: info
    secrets:
      - hltc_token
    volumes:
      - hltc-data:/data
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

volumes:
  hltc-data:

secrets:
  hltc_token:
    file: ./secrets/hltc_token
